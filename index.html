<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SLIME LABS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@600;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{px:['"Press Start 2P"','monospace']}}}}</script>
<style>
body{margin:0;background:#071522;color:#eef4ff;font-family:Nunito,sans-serif;font-weight:600;
background-image:linear-gradient(#0b1d2e 2px,transparent 2px),linear-gradient(90deg,#0b1d2e 2px,transparent 2px);background-size:32px 32px}
.px{background:#102941;border:4px solid #03090f;box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.07),0 4px 0 #03090f}
.px-dark{background:#0B1D2E;border:4px solid #03090f;box-shadow:inset 4px 4px 0 rgba(0,0,0,.4)}
.btn{font-family:'Press Start 2P',monospace;font-size:10px;padding:12px 16px;background:#B8FF3D;color:#071522;border:4px solid #03090f;box-shadow:inset -4px -4px 0 #7fb81e,0 4px 0 #03090f;cursor:pointer}
.btn:hover{background:#C8FF00}.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 #7fb81e}
.btn.alt{background:#1a3a5c;color:#eef4ff;box-shadow:inset -4px -4px 0 #0f2640,0 4px 0 #03090f}.btn.alt:hover{background:#24507d}
.btn:disabled{background:#2a4058;color:#6f8aa5;box-shadow:inset -4px -4px 0 #1c2e40,0 4px 0 #03090f;cursor:not-allowed}
.slot{display:flex;align-items:center;justify-content:center;text-align:center;border:4px dashed #2a5a7a;background:#0B1D2E;color:#6f9ab8;font:8px/16px 'Press Start 2P',monospace;padding:6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;font-weight:800;font-size:15px;color:#eef4ff;border:0;background:transparent}
.nav:hover{background:#102941}
.nav.on{background:#B8FF3D;color:#071522;clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);box-shadow:inset 0 -4px 0 #7fb81e}
.logo{font-family:'Press Start 2P',monospace;line-height:1;text-shadow:3px 0 #03090f,-3px 0 #03090f,0 3px #03090f,0 -3px #03090f,3px 3px #03090f,-3px -3px #03090f,3px -3px #03090f,-3px 3px #03090f}
.scroll-x{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none}
.card{transition:transform .1s;cursor:pointer}.card:hover{transform:translateY(-4px)}
@keyframes bob{50%{transform:translateY(-6px)}}.bob{animation:bob 2s steps(4) infinite}
@keyframes rise{from{transform:translateY(0);opacity:.8}to{transform:translateY(-120px);opacity:0}}.bub{position:absolute;width:6px;height:6px;background:#fff8;animation:rise 3s steps(6) infinite}
@keyframes blink{50%{opacity:.3}}.blink{animation:blink 1s steps(2) infinite}
@media(prefers-reduced-motion:reduce){.bob,.bub,.blink{animation:none}}
</style></head>
<body>
<div class="min-h-screen md:flex">
 <div class="hidden md:block md:w-20 lg:w-60 sticky top-0 h-screen shrink-0" id="side"></div>
 <div id="drawer" class="fixed inset-0 z-50 hidden md:hidden"><div class="w-64 h-full" id="side2"></div><div class="flex-1 bg-black/60" onclick="tog()" style="position:absolute;inset:0;left:16rem"></div></div>
 <div class="flex-1 min-w-0">
  <header class="sticky top-0 z-40 bg-[#071522] border-b-4 border-[#03090f] flex items-center gap-3 px-3 py-3">
   <button class="md:hidden btn alt !p-2" onclick="tog()"><i data-lucide="menu" class="w-4 h-4"></i></button>
   <span class="md:hidden font-px text-[10px] text-[#B8FF3D]">SLIME LABS</span>
   <div class="ml-auto flex items-center gap-2 text-xs">
    <div class="px-dark px-2 py-1"><div class="text-[#8fa9c2] text-[10px]">Goo</div><b class="text-[#B8FF3D]">12,450</b></div>
    <div class="px-dark px-2 py-1"><div class="text-[#8fa9c2] text-[10px]">Essence</div><b class="text-[#2fd4ff]">320</b></div>
    <div class="px-dark hidden sm:flex items-center gap-2 px-2 py-2"><i data-lucide="wallet" class="w-4 h-4"></i>0x3a...9f2d</div>
   </div>
  </header>
  <main id="main" class="p-3 sm:p-5 max-w-6xl mx-auto space-y-8"></main>
 </div>
</div>
<script>
/* ===== Slime image assets: isi path PNG/WebP di sini untuk mengganti placeholder ===== */
const IMG={default:'' /* contoh: '/slimes/042.png' */, machine:'', avatar:''};
const SI=(cls='',label='SLIME IMAGE',key='default')=>IMG[key]?`<img src="${IMG[key]}" class="object-contain ${cls}" style="image-rendering:pixelated">`:`<div class="slot ${cls}">${label}</div>`;

const RC={Common:'#8b9bb0',Uncommon:'#6fdc3a',Rare:'#3d9bff',Epic:'#a45bff',Legendary:'#ffc83d'};
const EL={Fire:['flame','#ff7a2f'],Water:['waves','#2fd4ff'],Nature:['leaf','#B8FF3D'],Earth:['mountain','#d49a4a'],Wind:['wind','#9be8d8'],Light:['sun','#ffe14d'],Dark:['moon','#a45bff']};
const slimes=[['042',12,'Nature','Rare'],['087',8,'Water','Uncommon'],['129',15,'Fire','Epic'],['201',5,'Wind','Common'],['255',20,'Light','Legendary'],['310',9,'Dark','Rare']].map(([n,lv,el,r])=>({n:'Slime #'+n,lv,el,r}));
const essence=[['Fire',320,'Epic','Burns hot. Fuels power experiments.'],['Water',280,'Rare','Flows into every formula.'],['Earth',190,'Uncommon','Dense and steady.'],['Wind',210,'Uncommon','Light, quick, restless.'],['Light',95,'Legendary','Rare spark of pure energy.'],['Dark',120,'Epic','Heavy, quiet, strange.']];
const types=[['droplets','Goo Experiment','Produce Goo','#B8FF3D'],['gem','Essence Experiment','Produce Elemental Essence','#2fd4ff'],['dna','Mutation Experiment','Increase stats and discover mutations','#a45bff'],['book-open','Research Experiment','Unlock new formulas','#ffc83d']];
const nav=[['','home','Home'],['slimes','boxes','Slimes'],['lab','flask-conical','Lab'],['essence','gem','Essence'],['craft','hammer','Craft'],['market','store','Market'],['leaderboard','trophy','Leaderboard'],['profile','user','Profile']];

const T=(t,sub)=>`<div class="mb-4"><h2 class="font-px text-sm sm:text-base text-[#B8FF3D]" style="text-shadow:3px 3px 0 #03090f">${t}</h2>${sub?`<p class="text-sm text-[#8fa9c2] mt-2">${sub}</p>`:''}</div>`;
const pill=r=>`<span class="font-px text-[7px] px-2 py-1 border-2 border-[#03090f]" style="background:${RC[r]};color:#071522">${r.toUpperCase()}</span>`;
const ic=(n,c='',s=16)=>`<i data-lucide="${n}" style="color:${c};width:${s}px;height:${s}px"></i>`;
const card=(s,price,seller)=>{const[i,c]=EL[s.el];return `<div class="px card p-2" style="border-top-color:${RC[s.r]}">
<div class="relative">${SI('w-full aspect-square')}<span class="absolute top-1 left-1 p-1 bg-[#071522]">${ic(i,c)}</span><span class="absolute top-1 right-1 w-3 h-3 bg-[#B8FF3D] border-2 border-[#03090f]" title="Idle"></span></div>
<div class="flex justify-between items-center mt-2 gap-1"><b class="text-sm">${s.n}</b>${pill(s.r)}</div>
<div class="flex justify-between text-xs text-[#8fa9c2] mt-1"><span>Lv. ${s.lv}</span><span style="color:${c}">${s.el}</span></div>
<div class="grid grid-cols-3 gap-1 mt-2 text-[10px] text-center">${['ATK','DEF','LUK'].map((k,j)=>`<div class="px-dark py-1">${k} ${s.lv*2+j*3}</div>`).join('')}</div>
${price?`<div class="mt-2 flex justify-between text-xs"><b class="text-[#B8FF3D]">${price} Goo</b><span class="text-[#8fa9c2]">${seller}</span></div>`:''}</div>`};
const opts=(sel=0)=>types.map(([i,t,d,c],k)=>`<div class="px p-3 flex items-center gap-3" style="${k===sel?'border-color:#B8FF3D':''}"><div class="px-dark w-12 h-12 flex items-center justify-center shrink-0">${ic(i,c,24)}</div><div class="flex-1 min-w-0"><b class="text-sm">${t}</b><p class="text-xs text-[#8fa9c2]">${d}</p></div><button class="btn ${k===sel?'':'alt'}">${k===sel?'SELECTED':'SELECT'}</button></div>`).join('');
const HERO='assets/home/herobaner.jpg';
const scene=()=>`<div class="px overflow-hidden !p-0"><img src="${HERO}" alt="Slime Labs" class="block w-full h-56 sm:h-80 lg:h-[26rem] object-cover" style="image-rendering:pixelated"></div>`;
const res=[['Goo','12,450','droplets','#B8FF3D'],['Fire Essence',320,'flame','#ff7a2f'],['Aqua Essence',280,'waves','#2fd4ff'],['Earth Essence',190,'mountain','#d49a4a'],['Wind Essence',210,'wind','#9be8d8'],['Light Essence',95,'sun','#ffe14d'],['Dark Essence',120,'moon','#a45bff']];
const all=[...slimes,...slimes];
const slot=t=>`<div class="px-dark w-32 h-24 flex items-center justify-center text-center text-xs p-2">${t}</div>`;

const pages={
'':()=>scene()+`<section>${T('YOUR SLIMES')}<div class="grid grid-cols-2 md:grid-cols-3 gap-3">${slimes.map(s=>card(s)).join('')}</div></section>
<section>${T('EXPERIMENT LAB','Send your Slimes into experiments and discover new resources.')}<div class="grid lg:grid-cols-2 gap-4">${SI('min-h-48 lg:min-h-full','LAB MACHINE IMAGE','machine')}<div class="space-y-3">${opts()}</div></div></section>
<section>${T('RESOURCES')}<div class="scroll-x pb-2">${res.map(([n,v,i,c])=>`<div class="px p-3 min-w-[130px] shrink-0">${ic(i,c,22)}<div class="text-xs text-[#8fa9c2] mt-2">${n}</div><b class="font-px text-xs">${v}</b></div>`).join('')}</div></section>`,
slimes:()=>T('MY SLIMES')+`<div class="flex flex-wrap gap-2">${['All','Common','Uncommon','Rare','Epic','Legendary'].map((f,i)=>`<button class="btn ${i?'alt':''}">${f}</button>`).join('')}</div>
<div class="flex flex-col sm:flex-row gap-2"><div class="px-dark flex items-center gap-2 px-3 py-2 flex-1">${ic('search')}<span class="text-sm text-[#6f9ab8]">Search Slime</span></div><button class="btn alt">SORT: LEVEL</button><button class="btn alt">SORT: RARITY</button></div>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${all.map(s=>card(s)).join('')}</div>`,
lab:()=>T('LAB')+`<div class="grid lg:grid-cols-[1fr_1.4fr_1fr] gap-4">
<div class="px p-3"><b class="text-sm">Selected Slime</b>${SI('w-full aspect-square mt-2')}<div class="text-xs text-[#8fa9c2] mt-2">Slime #042 · Lv. 12 · Nature</div></div>
<div class="px p-3 flex items-center justify-center min-h-80 relative overflow-hidden" style="background:#0a2236"><div class="absolute inset-x-6 top-4 h-3 bg-[#2a4058]"></div><div class="relative overflow-hidden w-44 h-60 border-4 border-[#03090f] bg-[#B8FF3D]/20 flex items-end justify-center"><div class="bub left-6 bottom-2"></div><div class="bub right-8 bottom-6" style="animation-delay:1.2s"></div><div class="bob mb-6">${SI('w-28 h-28')}</div></div><div class="absolute bottom-3 inset-x-6"><div class="h-4 px-dark"><div class="h-full w-2/3 bg-[#B8FF3D]"></div></div></div></div>
<div class="px p-3 space-y-2"><b class="font-px text-[10px] text-[#B8FF3D]">EXPERIMENT</b>${[['Duration','3 Hours'],['Power','84'],['Expected Goo','120'],['Expected Essence','14']].map(([a,b])=>`<div class="flex justify-between text-sm border-b-2 border-[#0B1D2E] py-1"><span class="text-[#8fa9c2]">${a}</span><b>${b}</b></div>`).join('')}<button class="btn w-full mt-2">START EXPERIMENT</button><button class="btn w-full" disabled>LAB BUSY</button></div></div>
${T('EXPERIMENT TYPES')}<div class="grid md:grid-cols-2 gap-3">${opts()}</div>`,
essence:()=>T('ESSENCE')+`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">${essence.map(([n,q,r,d])=>{const[i,c]=EL[n];return `<div class="px p-4 flex gap-3"><div class="px-dark w-14 h-14 flex items-center justify-center shrink-0">${ic(i,c,28)}</div><div><div class="flex gap-2 items-center flex-wrap"><b>${n}</b>${pill(r)}</div><div class="font-px text-sm my-1">${q}</div><p class="text-xs text-[#8fa9c2]">${d}</p></div></div>`}).join('')}</div>`,
craft:()=>T('CRAFT ITEM')+`<div class="px p-6 flex flex-col items-center gap-3"><div class="flex items-center gap-3 flex-wrap justify-center">${slot('3x Fire Essence')}${ic('plus','',20)}${slot('2x Goo')}</div>${ic('arrow-down','',24)}<div class="px-dark w-32 h-32 flex items-center justify-center font-px text-xl text-[#ffc83d]">?</div><div class="text-sm">Unknown Item</div><button class="btn">CRAFT</button></div>`,
market:()=>T('MARKET')+`<div class="flex gap-2">${['Slimes','Essence','Items'].map((t,i)=>`<button class="btn ${i?'alt':''}">${t}</button>`).join('')}</div><div class="grid grid-cols-2 md:grid-cols-4 gap-3">${all.slice(0,8).map((s,i)=>card(s,(i+1)*150,'0x'+(71+i)+'...a'+i)).join('')}</div>`,
leaderboard:()=>T('SLIME LABS LEADERBOARD')+`<div class="space-y-2"><div class="hidden sm:grid grid-cols-[50px_1fr_80px_100px_110px] px-3 text-xs text-[#8fa9c2]"><span>Rank</span><span>Player</span><span>Slimes</span><span>Lab Power</span><span>Goo Earned</span></div>${['0x3a...9f2d','0x91...c4e1','0x7b...02aa','0xd4...5b19','0x18...e7f3','0xaa...3c80'].map((p,i)=>`<div class="px p-3 grid grid-cols-[40px_1fr_auto] sm:grid-cols-[50px_1fr_80px_100px_110px] items-center gap-2 text-sm" style="${i?'':'border-color:#ffc83d'}"><b class="font-px text-xs" style="color:${['#ffc83d','#c0cad6','#d49a4a'][i]||'#fff'}">#${i+1}</b><span>${p}</span><span class="hidden sm:block">${24-i*3}</span><span class="hidden sm:block">${980-i*90}</span><b class="text-[#B8FF3D]">${(48200-i*6100).toLocaleString()}</b></div>`).join('')}</div>`,
profile:()=>T('PROFILE')+`<div class="px p-4 flex items-center gap-4">${SI('w-20 h-20 shrink-0','AVATAR','avatar')}<div><b>Lab Technician</b><div class="text-sm text-[#8fa9c2]">0x3a...9f2d</div><div class="font-px text-[10px] text-[#B8FF3D] mt-2">LAB LEVEL 7</div></div></div>
<div class="grid grid-cols-3 gap-3">${[['Slimes',24],['Goo','12,450'],['Essence',1215]].map(([a,b])=>`<div class="px p-3 text-center"><div class="text-xs text-[#8fa9c2]">${a}</div><b class="font-px text-xs">${b}</b></div>`).join('')}</div>
${T('ACHIEVEMENTS')}<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">${['First Brew','Mutation Found','10 Slimes','Top 100'].map((a,i)=>`<div class="px p-4 text-center" style="${i>2?'opacity:.4':''}"><div class="px-dark mx-auto w-12 h-12 flex items-center justify-center">${ic('trophy','#ffc83d',24)}</div><div class="text-xs mt-2">${a}</div></div>`).join('')}</div>`
};

const NC={'home':'','boxes':'#4fd8ff','flask-conical':'#4fa8ff','gem':'#5b8bff','hammer':'#6ec1ff','store':'#ff9a3d','trophy':'#ffc83d','user':'#4fd8ff'};
const blk=(c,x,y,w,h)=>`<div class="absolute" style="background:${c};left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`;
const sideScene=()=>`<div class="relative mt-auto h-40 overflow-hidden md:hidden lg:block border-4 border-[#03090f] bg-[#0a2236]">
${blk('#6fdc3a',0,78,300,10)}${blk('#9bf04f',0,78,300,3)}${blk('#5a3d2b',0,88,300,80)}${blk('#3f2a1d',20,100,30,6)}${blk('#3f2a1d',90,112,40,6)}${blk('#3f2a1d',150,100,24,6)}
${blk('#6b4423',24,50,8,28)}${blk('#4fb52a',8,28,40,12)}${blk('#6fdc3a',14,16,28,14)}${blk('#9bf04f',20,8,16,10)}${blk('#4fb52a',16,38,32,8)}
${blk('#2a4058',92,38,44,40)}${blk('#03090f',96,42,36,26)}${blk('#4fa8ff',100,46,28,18)}${blk('#8fd0ff',104,50,8,4)}
${blk('#03090f',40,118,110,24)}${[0,1,2].map(i=>blk(['#B8FF3D','#ffc83d','#4fd8ff'][i],50+i*34,124,18,12)).join('')}
${blk('#ffffff',160,30,3,3)}${blk('#4fd8ff',180,50,3,3)}</div>`;
function side(cur){return `<aside class="h-full flex flex-col bg-[#0B1D2E] border-r-4 border-[#03090f] p-3 gap-4">
<div class="flex flex-col items-start gap-1 px-1 pt-2 pb-2"><div class="logo text-[#B8FF3D] text-[22px] md:hidden lg:block">SLIME</div>
<div class="flex items-center gap-2">${SI('w-9 h-9 shrink-0 !p-0','')}<div class="logo text-white text-[22px] md:hidden lg:block">LABS</div></div></div>
<nav class="flex flex-col gap-1">${nav.map(([h,i,t])=>`<a href="#/${h}" class="nav ${h===cur?'on':''}" onclick="document.getElementById('drawer').classList.add('hidden')">${ic(i,h===cur?'#071522':NC[i],22)}<span class="md:hidden lg:inline">${t}</span></a>`).join('')}</nav>
${sideScene()}</aside>`}
function tog(){document.getElementById('drawer').classList.toggle('hidden')}
function route(){const h=location.hash.replace(/^#\//,'');const k=pages[h]?h:'';
 document.getElementById('main').innerHTML=pages[k]();
 document.getElementById('side').innerHTML=document.getElementById('side2').innerHTML=side(k);
 document.title='SLIME LABS'+(k?' · '+k.toUpperCase():'');window.scrollTo(0,0);lucide.createIcons()}
addEventListener('hashchange',route);route();
</script>
</body></html>
